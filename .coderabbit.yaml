# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit configuration for the Egg, Inc. helper tools monorepo.
# Reference: https://docs.coderabbit.ai/reference/configuration
#
# Goal: keep review attention on hand-written code. This repo carries a large
# amount of machine-generated game data (see reviews.path_filters), and several
# GitHub Actions workflows commit regenerated blobs on a schedule.

language: en-US
early_access: false

reviews:
  # CodeRabbit recommends starting on `chill` and tightening to `assertive`
  # once the team is comfortable with the signal-to-noise ratio.
  profile: chill

  # Never let the bot gate a merge by requesting changes.
  request_changes_workflow: false

  # --- Walkthrough / summary comment -------------------------------------
  # Deliberately minimal: inline findings are the valuable part, the prose
  # summary is not. Flip high_level_summary back on if you miss it.
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false

  estimate_code_review_effort: true
  related_issues: true
  related_prs: true
  assess_linked_issues: true

  collapse_walkthrough: true
  review_status: true

  # --- Which pull requests get reviewed ----------------------------------
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_usernames:
      # Dependency bumps (npm, gomod, pip, github-actions) — see
      # .github/dependabot.yml. Nothing here benefits from an AI review.
      - "dependabot[bot]"
    ignore_title_keywords:
      - "wip"
      - "chore(deps)"

  # --- Files excluded from review ----------------------------------------
  # Everything below is generated, vendored, or encrypted. A diff in these
  # files is machine output; review comments on them are pure noise.
  path_filters:
    # Lockfiles
    - "!pnpm-lock.yaml"
    - "!go.sum"
    - "!periodicals/uv.lock"

    # Build output
    - "!**/dist/**"

    # git-crypt encrypted fixtures (unreadable ciphertext)
    - "!eicoop/mock/*.txt"

    # Generated type definitions
    - "!ui/heroicons.d.ts"

    # Protobuf schemas and everything generated from them.
    - "!**/*.proto"
    - "!periodicals/ei.py"
    - "!periodicals/ei.pb.go"

    # Game data refreshed by .github/workflows/update-*.yml
    - "!wasmegg/artifact-explorer/data/loot.json"
    # Scoped to the data files only: these directories also hold the
    # hand-written loot.go transformation logic, which must stay reviewable.
    - "!wasmegg/_common/loot/latest-mission_reward_count.json"
    - "!wasmegg/_common/loot_legacy/mission_reward_count.json"
    - "!**/contracts.json"
    - "!**/events.json"
    - "!wasmegg/events/src/legacy_events.json"
    - "!**/version_history.json"
    - "!**/colleggtible-contracts.json"
    # contractseasons.json and seasoncontracts.json are two different
    # generated files; both exist and both need excluding.
    - "!**/contractseasons.json"
    - "!**/seasoncontracts.json"
    - "!**/customeggs.json"
    - "!periodicals/data/**"

    # Game data regenerated by the per-workspace Makefiles (`make data`)
    - "!wasmegg/virtue-companion/src/lib/catalog.json"

    # Bulk artifact/research stat tables
    - "!lib/artifacts/data.json"
    - "!lib/artifacts/consumption.json"
    - "!lib/eiafx-config.json"
    - "!wasmegg/_common/eiafx/eiafx-data.json"
    - "!wasmegg/_common/eiafx/eiafx-config.json"
    - "!wasmegg/_common/consumption/consumption-data.json"

  # --- Path-scoped review instructions -----------------------------------
  path_instructions:
    - path: "**/*.{ts,vue,js}"
      instructions: >-
        Formatting is fully delegated to Prettier (printWidth 120, single
        quotes, ES5 trailing commas, 2-space indent, semicolons) and enforced
        by ESLint via eslint-config-prettier. Do NOT comment on whitespace,
        line length, quote style, semicolons, or trailing commas — those are
        decided by tooling and any such comment is noise. Do not suggest
        adding rules that ESLint already covers; check eslint.config.mjs
        first.

    - path: "**/*.vue"
      instructions: >-
        Single-file components use Vue 3 `<script setup lang="ts">`. Focus on:
        reactivity correctness (ref vs reactive, losing reactivity by
        destructuring a reactive object, missing `.value`), computed
        properties that mutate state, watchers that should be `computed`,
        `v-for` without a stable `:key`, props mutated directly instead of
        emitting, and lifecycle cleanup (event listeners, intervals, and
        observers registered in `onMounted` must be torn down in
        `onUnmounted`).

    - path: "lib/**"
      instructions: >-
        This is the shared library consumed by every workspace in
        pnpm-workspace.yaml (eicoop, ui, and all wasmegg/* apps). Treat any
        change to an exported signature, return shape, or thrown-error
        contract as potentially breaking and call out which consumers are
        affected. Be strict about backwards compatibility here in a way you
        would not be inside a single app.

    - path: "lib/api/**"
      instructions: >-
        This wraps the private Egg, Inc. API. Flag missing error handling on
        network calls, unvalidated assumptions about response shape, and any
        change that could send malformed requests upstream. Do not suggest
        adding retries or backoff that would increase load on the upstream
        API without a clear reason.

    - path: "wasmegg/**/src/**"
      instructions: >-
        Client-side single-page apps that decode user-supplied Egg, Inc. save
        data. Flag unguarded array indexing and non-null assertions on values
        derived from decoded save data, since malformed or unexpected input
        reaches this code directly. Prefer correctness of the game-math over
        micro-optimisation.

    - path: "**/*.go"
      instructions: >-
        Go tooling that regenerates the committed JSON data files. Flag
        unchecked errors, ignored `err` returns, and file writes that could
        leave a truncated or partially-written data file on failure.

    - path: ".github/workflows/**"
      instructions: >-
        Flag unpinned third-party actions (prefer a commit SHA), secrets
        interpolated directly into `run:` blocks, missing least-privilege
        `permissions:` blocks, and workflows that could push to the default
        branch without a guard.

  # --- Pre-merge checks ---------------------------------------------------
  pre_merge_checks:
    title:
      mode: error
      requirements: >-
        The title should be a concise, imperative description of the change
        (e.g. "Fix stale artifact totals in the ascension planner"). If the
        change is scoped to one workspace, name it. Do not require a
        Conventional Commits prefix.
    description:
      mode: error
    issue_assessment:
      mode: warning
    # This codebase does not use docstrings as a convention; a coverage
    # threshold here would produce a permanent, unactionable warning.
    docstrings:
      mode: "off"

  # --- Static analysis matched to the actual stack ------------------------
  tools:
    # TypeScript / Vue / JavaScript
    eslint:
      enabled: true
    # Redundant with the ESLint + Prettier setup above; would double-report.
    biome:
      enabled: false
    oxc:
      enabled: false

    # Go
    golangci-lint:
      enabled: true

    # Protobuf
    buf:
      enabled: false

    # Python (periodicals/, update-egg-config-gist/)
    ruff:
      enabled: true

    # CI, shell, config
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    checkmake:
      enabled: true
    markdownlint:
      enabled: true

    # Secret scanning
    gitleaks:
      enabled: true

    # Prose grammar checking on comments and Markdown — mostly noise here.
    languagetool:
      enabled: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - ".github/copilot-instructions.md"
  # Keep everything learned from this repo scoped to this repo.
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

chat:
  auto_reply: true
  art: false
